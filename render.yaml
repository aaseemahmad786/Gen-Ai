services:
  - type: web
    name: genai-workbench
    runtime: python
    plan: free
    region: singapore
    buildCommand: uv sync --locked
    startCommand: uv run --no-sync python app.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.14"
      - key: HOST
        value: "0.0.0.0"
      - key: APP_USER
        value: genai
      - key: APP_PASSWORD
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
